<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0284c7">
    <title>Mode Offline — Mentoring Agama Islam UKMI Polmed</title>
    <link rel="icon" type="image/jpeg" href="public/assets/img/favicon.jpeg">
    <link rel="stylesheet" href="public/assets/css/style.css">
    <style>
        .offline-box {
            max-width: 520px;
            margin: 40px auto;
            text-align: center;
        }
        .offline-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .offline-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card offline-box">
        <div class="offline-icon">📡</div>
        <h1 class="page-title" style="margin-bottom:8px;">Anda Sedang Offline</h1>
        <p style="color: var(--text-muted); font-size: 0.94rem; line-height: 1.6;">
            Halaman yang Anda buka belum tersedia di cache perangkat. Anda tetap dapat menggunakan
            <b>Input Laporan</b> maupun <b>Form Pendaftaran</b> secara offline — data akan otomatis
            tersinkronisasi saat koneksi internet kembali.
        </p>
        <div class="offline-actions">
            <a href="./" class="btn-action" style="width:auto; padding:12px 20px;">Buka Input Laporan</a>
            <a href="./daftar" class="btn-action secondary" style="width:auto; padding:12px 20px;">Buka Form Pendaftaran</a>
        </div>
    </div>
</div>

</html>
